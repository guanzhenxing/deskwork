name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the DSH dependency closure and patch ledger
        run: |
          pnpm verify:dsh-closure
          pnpm verify:patches
      - name: Run repository checks
        run: pnpm check

  macos:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run integration tests
        run: pnpm test:integration
      - name: Run headless boot smoke
        run: pnpm smoke:headless
      - name: Run Desktop UI smoke
        run: pnpm smoke:dsh-ui
      - name: Run Host crash smoke
        run: pnpm smoke:host-crash
      - name: Run profile-recovery smoke
        run: pnpm smoke:profile-recovery
      - name: Run safe-mode smoke
        run: pnpm smoke:safe-mode
      - name: Run conversation smoke
        run: pnpm smoke:conversation
      - name: Run auth smoke
        run: pnpm smoke:auth
      - name: Run navigation smoke
        run: pnpm smoke:navigation
      - name: Run lifecycle smoke
        run: pnpm smoke:lifecycle

  # Build the packaged candidate on macOS and keep the artifacts as
  # private job output (no public release). The artifact-level smoke runs
  # against the DMG candidate exactly as locally.
  macos-package:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate the release compatibility manifest
        run: pnpm generate:compatibility
      - name: Build the packaged candidate (dir + dmg)
        run: |
          pnpm package:dir
          pnpm package:dmg
      - name: Run the artifact-level package smoke
        run: pnpm smoke:package
      - name: Upload candidate artifacts (private job output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ runner.arch }}
          path: |
            release/dist/*.dmg
            release/artifacts.json
            release/SHA256SUMS
            release/package-smoke.json
          retention-days: 14

